name: Build patched BossModReborn

# Builds the latest upstream release tag with patches/*.patch applied, publishes it as a
# GitHub release and updates repo.json (the Dalamud custom plugin repository).
on:
  schedule:
    - cron: '47 */4 * * *'
  push:
    branches: [main]
    paths: ['patches/**', 'PATCH_REVISION', '.github/workflows/**']
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if a release for this version already exists
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/FFXIV-CombatReborn/BossmodReborn.git
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          path: fork

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = git ls-remote --tags --refs $env:UPSTREAM |
            ForEach-Object { ($_ -split 'refs/tags/')[1] } |
            Where-Object { $_ -match '^\d+\.\d+\.\d+\.\d+$' } |
            Sort-Object { [version]$_ } | Select-Object -Last 1
          $rev = [int](Get-Content fork/PATCH_REVISION -Raw).Trim()
          $v = [version]$tag
          # Upstream 7.5.6.28 + patch revision 1 => 7.5.6.2801: always newer than the upstream
          # release it is based on, and older than the next upstream release.
          $version = "$($v.Major).$($v.Minor).$($v.Build).$($v.Revision * 100 + $rev)"
          gh release view $version --repo $env:GITHUB_REPOSITORY *> $null
          $exists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          $skip = $exists -and '${{ inputs.force }}' -ne 'true'
          "Upstream $tag, patch revision $rev => $version (release exists: $exists, skip: $skip)"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "skip=$($skip.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Checkout upstream and apply patches
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: |
          git clone --filter=blob:none --branch ${{ steps.version.outputs.tag }} $env:UPSTREAM upstream
          cd upstream
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git am --3way (Get-ChildItem ../fork/patches/*.patch | Sort-Object Name | ForEach-Object FullName)
          if ($LASTEXITCODE -ne 0) { throw "Patches no longer apply to upstream ${{ steps.version.outputs.tag }}" }

      - name: Set up .NET
        if: steps.version.outputs.skip != 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip -DestinationPath "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Build
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        working-directory: upstream
        run: |
          $v = '${{ steps.version.outputs.version }}'
          # Fork branding in the plugin manifest. InternalName stays "BossModReborn" so settings, replays,
          # the CustomModules folder and other plugins' BMR integrations keep working.
          $manifestPath = 'BossMod/BossModReborn.json'
          $m = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $m.Name = 'BossModRebornButBetter'
          $m.Author = "$($m.Author) (fork by IndividualGather)"
          $m.Description = @(
            "An unofficial fork of BossMod Reborn by The Combat Reborn Team: https://github.com/FFXIV-CombatReborn/BossmodReborn"
            "All credit for the plugin goes to the original authors."
            ""
            "Why this fork exists: the official plugin only runs the boss modules built into it. This fork adds a single feature: it also loads boss module DLLs from the CustomModules folder in the plugin's config directory, which can add modules or replace built-in ones. That way custom versions of encounters can be maintained separately instead of in a full fork of the plugin."
            ""
            "Everything else is unchanged. It is rebuilt automatically from every official release."
            ""
            "Not affiliated with or supported by The Combat Reborn Team. Please don't report issues with this fork to them."
          ) -join "`n"
          $m.Punchline = "$($m.Punchline). Loads extra boss modules from the CustomModules config folder."
          $m.RepoUrl = "https://github.com/$env:GITHUB_REPOSITORY"
          ConvertTo-Json -InputObject $m -Depth 5 | Set-Content $manifestPath -Encoding utf8NoBOM
          dotnet restore BossMod/BossModReborn.csproj
          dotnet build --no-restore -c Release BossMod/BossModReborn.csproj `
            -p:AssemblyVersion=$v -p:FileVersion=$v -p:PackageVersion=$v -p:InformationalVersion=$v `
            --output ..\build
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }
          # same packaging as upstream's publish workflow
          Get-ChildItem ..\build\* -Exclude BossModReborn.*,DefaultRotationPresets.json,RebornPresets.json,PInvoke.User32.dll | Remove-Item -Force -Recurse
          Compress-Archive -Path ..\build\* -DestinationPath ..\build\latest.zip

      - name: Publish release
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          gh release view $v --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $v build/latest.zip --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $v build/latest.zip --repo $env:GITHUB_REPOSITORY `
              --title "$v" --notes "Upstream ${{ steps.version.outputs.tag }} with patch revision $(Get-Content fork/PATCH_REVISION -Raw)"
          }
          if ($LASTEXITCODE -ne 0) { throw "Release failed" }

      - name: Update repo.json
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $m = Get-Content build/BossModReborn.json -Raw | ConvertFrom-Json
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$v/latest.zip"
          $m | Add-Member -Force DownloadLinkInstall $url
          $m | Add-Member -Force DownloadLinkUpdate $url
          $m | Add-Member -Force DownloadLinkTesting $url
          $m | Add-Member -Force LastUpdate ([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())
          $m | Add-Member -Force IsHide $false
          $m | Add-Member -Force IsTestingExclusive $false
          ConvertTo-Json -InputObject @($m) -Depth 5 | Set-Content fork/repo.json -Encoding utf8NoBOM
          cd fork
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo.json
          git commit -m "Release $v"
          git push
